# MAPPO parameters

# Detailed explanation for each hyper parameter can be found in ray/rllib/agents/ppo/ippo.py

algo_args:
  use_gae: True
  lambda: 0.95
  gamma: 0.99
  kl_coeff: 0.2
  batch_episode: 5
  sgd_minibatch_episode: 5
  num_sgd_iter: 10
  vf_loss_coeff: 1.0
  lr: 0.0005
  critic_lr: 0.0005
  entropy_coeff: 0.01
  clip_param: 0.3
  vf_clip_param: 100.0
  gain: 0.01
  batch_mode: "truncate_episodes"
  vf_use_prev_agent_policies: True # input previous agent policies for the value function
  use_agent_chained_gae: True # gae computation with agent chaining
  use_prev_agent_policies: True 
  prev_agent_policy_access: False # direct access to predecessor policy networks (requires share_policy=individual)
  use_belief_networks: False # train per-agent belief nets to predict predecessor distributions (discrete only)
  belief_lr: 0.001 # learning rate for belief network optimizer
  belief_hidden_size: 64 # hidden layer size for belief network (2-layer MLP)