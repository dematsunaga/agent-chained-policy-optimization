# MADDPG finetuned parameters for MAMuJoCo Humanoid

algo_args:
  batch_episode: 1000
  learning_starts_episode: 10
  twin_q: False
  prioritized_replay: False
  smooth_target_policy: False
  n_step: 10
  critic_lr: 0.001
  actor_lr: 0.0005
  buffer_size_episode: 100
  target_network_update_freq_episode: 1
  tau: 0.005
  batch_mode: "truncate_episodes"
  train_interval: 500
  update_per_train: 10
  reward_centering: False
